[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Call Me Maybe function calling in LLMs (Qwen/Qwen3-0.6B)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flake8>=7.3.0",
    "llm-sdk",
    "mypy>=2.3.1",
    "numpy>=2.2.6",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }
